    "SKU-A100", not "A100"). variant as one string (size/colour with "/", e.g. "M/navy").'
- role: user
  fixture: fixtures/en-catering-order-002.txt
generation:
  max_tokens: 350
  temperature: 0
  response_format: json
expected:
