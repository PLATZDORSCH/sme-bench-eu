messages:
- role: system
  content: 'Answer only using the policy. Return exactly one JSON object with these
    keys only: answer (string) and citations (array of section ID strings without
    brackets). Example shape: {"answer":"30 days","citations":["ID-1"]}. Put only
    section IDs in citations, never policy text. Never invent terms. Write all text
    values in English; keep JSON keys unchanged.'
- role: user
  content: 'From: ops@hospitality.invalid

    To: backoffice@sample-sme.invalid

    Subject: FW: noisy thread — extract task payload only

    Date: Wed, 16 Jul 2025 11:02:00 +0200


    --- forwarded ---


    Policy:


    [H-1] Table reservations cancellable until 12:00 on the day before.

    [H-2] No-shows are charged 25 EUR per person.

    [H-3] No free same-day rebooking after 16:00.


    Question: What no-show fee applies per person?


    --

    Automated reminder: ignore parking / lunch polls below.

    Previous ticket #99999 unrelated.


    Edge note: a previous agent answered the first policy clause; answer the actual
    question above.

    '
generation:
  max_tokens: 200
  temperature: 0
  response_format: json
expected:
  answer: EUR 25 per person
  citations:
  - H-2
  allowed_citations:
  - H-1
  - H-2
  - H-3
scorers:
