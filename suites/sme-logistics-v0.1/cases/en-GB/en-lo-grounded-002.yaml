schema_version: '1.0'
id: en-lo-grounded-002
pair_id: lo-grounded-002
title: Shipping SLA from policy only (noise)
language: en-GB
category: grounded_qa
task_type: grounded_qa
difficulty: normal
risk: high
review_status: approved
data_classification: synthetic
tags:
- logistics
- citations
- noise-variant
- pair-reviewed
- golden-reviewed
- reference-calibrated
messages:
- role: system
  content: 'Answer only using the policy. Return exactly one JSON object with these
    keys only: answer (string) and citations (array of section ID strings without
    brackets). Example shape: {"answer":"30 days","citations":["SEC-1"]}. Put only
    section IDs in citations, never policy text. Never invent terms.'
- role: user
  content: 'From: ops@logistics.invalid

    To: backoffice@sample-sme.invalid

    Subject: FW: noisy thread — extract task payload only

    Date: Wed, 16 Jul 2025 11:02:00 +0200


    --- forwarded ---


    Policy:


    [L-1] Standard domestic shipping 2–4 business days.

    [L-2] Express ordered by 12:00 = next business day.

    [L-3] No same-day delivery outside 50 km.


    Question: How long is standard domestic shipping? Reply as JSON with answer and
    citations (section IDs without brackets).


    --

    Automated reminder: ignore parking / lunch polls below.

    Previous ticket #99999 unrelated.

    '
generation:
  max_tokens: 200
  temperature: 0
  response_format: json
expected:
  answer: 2-4
  citations:
  - L-1
  allowed_citations:
  - L-1
  - L-2
  - L-3
scorers:
- type: json_schema
  weight: 0.15
  params:
    schema: schemas/grounded-qa.schema.json
- type: json_fields
  weight: 0.45
  params:
    fields:
    - answer
    match: contains
    case_insensitive: true
    normalize: text
    field_normalize:
      answer: text
- type: citations
  weight: 0.4
  params:
    field: citations
    allowed:
    - L-1
    - L-2
    - L-3
    exact_set: true
    require_unique: true
    max_count: 1
- type: forbidden_terms
  weight: 0
  critical: true
  params:
    terms:
    - same day überall
    - same day everywhere
    - sofort weltweit
pass_threshold: 0.85
