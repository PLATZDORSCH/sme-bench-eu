schema_version: '1.0'
id: de-lo-process-001
pair_id: lo-process-001
title: Versandbereitschaft prüfen
language: de-DE
category: process_ops
task_type: process_readiness
difficulty: hard
risk: high
review_status: approved
data_classification: synthetic
tags:
- logistics
- process
messages:
- role: system
  content: Entscheide die Versandbereitschaft. Gib JSON {next_step, ready, missing}
    zurück. ready=false, wenn ein Pflichtpunkt fehlt. missing MUSS ein Array kurzer
    Tokens sein (engl. snake_case, z. B. ["phone"]), kein einzelner String. next_step
    ist ein kurzer Aktions-String.
- role: user
  fixture: fixtures/de-dispatch-check.txt
generation:
  max_tokens: 200
  temperature: 0
  response_format: json
expected:
  next_step: Empfängertelefon erfassen
  ready: false
  missing:
  - phone
scorers:
- type: json_schema
  weight: 0.15
  params:
    schema: schemas/process-step.schema.json
- type: json_fields
  weight: 0.45
  params:
    fields:
    - next_step
    - ready
    case_insensitive: true
    patterns:
      next_step: (?=.*(?:\b(?:empf[aä]ngertelefon(?:nummer)?|empf[aä]nger(?:s)?\s+telefon(?:nummer)?|telefon(?:nummer)?\s+(?:des\s+)?empf[aä]ngers?|consignee\s+phone(?:\s+number)?)\b|recipient_?phone|consignee_?phone|(?:_|\b)phone(?:\s+number)?\b))(?=.*(?:\b(?:erfassen|hinzufügen|ergänzen|eintragen|notieren|anfordern|einholen|collect|obtain|get|add|request|record|capture)(?:_|\b))).+
  must_pass: true
- type: set_equality
  weight: 0.4
  params:
    field: missing
    ignore_order: true
    aliases:
      phone:
      - consignee_phone
      - recipient_phone
  must_pass: true
- type: forbidden_terms
  weight: 0
  critical: true
  params:
    terms:
    - '"ready": true'
    - '"ready":true'
pass_threshold: 0.85
