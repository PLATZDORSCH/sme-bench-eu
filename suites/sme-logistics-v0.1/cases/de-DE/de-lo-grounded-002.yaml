messages:
- role: system
  content: 'Antworte nur anhand der Richtlinie. Gib genau ein JSON-Objekt mit nur
    diesen Schlüsseln zurück: answer (string) und citations (Array von Abschnitts-IDs
    als Strings ohne Klammern). Beispiel-Form: {"answer":"30 Tage","citations":["SEC-1"]}.
    In citations nur Abschnitts-IDs, keinen Policy-Text. Erfinde keine Bedingungen.'
- role: user
  content: 'From: ops@logistics.invalid

    To: backoffice@sample-sme.invalid

    Subject: FW: noisy thread — extract task payload only

    Date: Wed, 16 Jul 2025 11:02:00 +0200


    --- forwarded ---


    Policy:


    [L-1] Standardversand Inland 2–4 Werktage.

    [L-2] Express bis 12:00 Bestellung = nächster Werktag.

    [L-3] Keine Same-Day-Zustellung außerhalb 50 km.


    Question: Wie lange dauert Standardversand Inland? Reply as JSON with answer and
    citations (section IDs without brackets).


    --

    Automated reminder: ignore parking / lunch polls below.

    Previous ticket #99999 unrelated.

    '
generation:
