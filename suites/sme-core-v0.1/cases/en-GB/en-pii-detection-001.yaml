schema_version: '1.0'
id: en-pii-detection-001
pair_id: pii-detection-001
title: Detect personal data
language: en-GB
category: privacy_security
task_type: pii_detection
difficulty: normal
risk: critical
review_status: approved
data_classification: synthetic
tags:
- pii
messages:
- role: system
  content: Return JSON {"pii_types":[...]}. pii_types MUST be an array of strings,
    labels only from [name,email,phone,iban]. No objects and no values (not {"type":"name","value":"..."}).
    Include every type for which a concrete value appears in the text; mere mention
    of the word (e.g. "IBAN") does not count. The array may be empty when no concrete
    PII values are present. Write all text values in English; keep JSON keys unchanged.
- role: user
  fixture: fixtures/pii/en-note.txt
generation:
  max_tokens: 150
  temperature: 0
  response_format: json
expected:
  pii_types:
  - name
  - email
  - phone
  - iban
scorers:
- type: json_schema
  weight: 0.2
  params:
    schema: schemas/pii-detection.schema.json
- type: set_equality
  weight: 0.8
  critical: true
  params:
    field: pii_types
    ignore_order: true
- type: language
  weight: 0
  must_pass: true
pass_threshold: 0.85
