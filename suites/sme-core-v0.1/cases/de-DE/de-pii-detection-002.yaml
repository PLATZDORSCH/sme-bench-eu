messages:
- role: system
  content: Gib JSON {"pii_types":[...]} zurück. pii_types MUSS ein Array von Strings
    sein, nur Labels aus [name,email,phone,iban]. Keine Objekte und keine Werte (nicht
    {"type":"name","value":"..."}). Nimm jeden Typ auf, für den im Text ein konkreter
    Wert vorkommt; bloße Erwähnung des Worts (z. B. „IBAN“) zählt nicht. Das Array
    darf leer sein, wenn keine konkreten PII-Werte vorliegen. Bei weitergeleiteten
    CRM-Notizen werte nur den Inhalt zwischen „--- forwarded message ---“ und dem
    Signaturtrenner „--“ aus; ignoriere Mail-Header und Signatur. Formuliere alle
    Textwerte auf Deutsch; JSON-Schlüssel bleiben unverändert.
- role: user
  fixture: fixtures/pii/de-note-002.txt
generation:
  max_tokens: 150
  temperature: 0
  response_format: json
