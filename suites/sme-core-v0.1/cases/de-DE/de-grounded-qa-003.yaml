messages:
- role: system
  content: 'Antworte nur anhand der Richtlinie. Gib genau ein JSON-Objekt mit nur
    diesen Schlüsseln zurück: answer (string) und citations (Array von Abschnitts-IDs
    als Strings ohne Klammern). Beispiel-Form: {"answer":"30 Tage","citations":["ID-1"]}.
    In citations nur Abschnitts-IDs, keinen Policy-Text. Erfinde keine Bedingungen.
    Formuliere alle Textwerte auf Deutsch; JSON-Schlüssel bleiben unverändert.'
- role: user
  content: 'Policy:

    [W-1] Gewährleistung 24 Monate ab Kaufdatum.

    [W-2] Verschleißteile ausgenommen.

    [W-3] Keine lebenslange Garantie.



    Question: Wie lange ist die Gewährleistung?'
