name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Validate suites
        run: |
          for suite in suites/sme-*-v0.1; do
            uv run sme-bench validate "$suite"
          done

      - name: Check README example files exist
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          missing = []
          for readme in (Path("README.md"), Path("README.de.md")):
              text = readme.read_text(encoding="utf-8")
              for match in re.finditer(r"examples/[A-Za-z0-9_./-]+\.json", text):
                  path = Path(match.group(0))
                  if not path.is_file():
                      missing.append(f"{readme}: {path}")
          if missing:
              raise SystemExit("Missing referenced example files:\n" + "\n".join(missing))
          print("All README example file references resolve.")
          PY

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=sme_bench --cov-report=term-missing --cov-report=xml --cov-fail-under=76
